# Redraws the contribution graph and the stat cards of the profile README every
# night (tools/contributions.py, tools/stats.py) and commits them when the numbers changed.
name: Profile stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draw the graph and the stat cards
        run: |
          python3 tools/contributions.py
          python3 tools/stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git add assets/contributions-*.svg assets/stats-*.svg assets/streak-*.svg
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Profile stats: daily update"
          git push
